scalar OID
scalar Amount_Fiat
scalar Amount_Currency
scalar Amount_Crypto
scalar Amount
scalar Upload

type SpeckleSyncLocalState {
    accessToken: String
    tokenLabel: String
}

type SpeckleSyncState {
    serverUrl: URL
    projectId: String
    projectName: String
    targetProjectDocumentId: PHID
    status: SyncStatus!
    autoSync: Boolean!
    versionsPerModel: Int!
    maxObjectsPerVersion: Int!
    lastRequestedAt: DateTime
    lastCompletedAt: DateTime
    lastError: String
    runs: [SyncRun!]!
}

type SyncRun {
    id: OID!
    requestedAt: DateTime!
    startedAt: DateTime
    finishedAt: DateTime
    outcome: RunOutcome!
    fullResync: Boolean!
    modelsSeen: Int!
    versionsSeen: Int!
    versionsAdded: Int!
    objectsScanned: Int!
    message: String
}

enum SyncStatus {
    IDLE
    REQUESTED
    RUNNING
    FAILED
}

enum RunOutcome {
    PENDING
    SUCCESS
    FAILURE
    CANCELLED
}

# connection

input SetServerConnectionInput {
    serverUrl: URL!
    projectId: String!
    projectName: String
}

input SetTargetProjectDocumentInput {
    targetProjectDocumentId: PHID!
}

input SetSyncOptionsInput {
    autoSync: Boolean
    versionsPerModel: Int
    maxObjectsPerVersion: Int
}

# credentials

input SetAccessTokenInput {
    accessToken: String!
    tokenLabel: String
}

input ClearAccessTokenInput {
    _: Boolean
}

# runs

input RequestSyncInput {
    id: OID!
    requestedAt: DateTime!
    fullResync: Boolean
}

input StartRunInput {
    runId: OID!
    startedAt: DateTime!
}

input CompleteRunInput {
    runId: OID!
    finishedAt: DateTime!
    modelsSeen: Int!
    versionsSeen: Int!
    versionsAdded: Int!
    objectsScanned: Int!
    message: String
}

input FailRunInput {
    runId: OID!
    finishedAt: DateTime!
    message: String!
}

input CancelRunInput {
    runId: OID!
    cancelledAt: DateTime!
    reason: String!
}