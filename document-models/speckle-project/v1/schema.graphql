type SpeckleProjectState {
    serverUrl: URL
    projectId: String
    name: String
    description: String
    visibility: String
    syncedAt: DateTime
    models: [SpeckleModel!]!
    revisions: [Revision!]!
    changes: [ChangeEntry!]!
}

type SpeckleModel {
    id: OID!
    speckleModelId: String!
    name: String!
    displayName: String
    updatedAt: DateTime
    latestVersionId: String
    versionCount: Int!
}

type Revision {
    id: OID!
    speckleModelId: String!
    modelName: String
    versionId: String!
    referencedObject: String!
    message: String
    sourceApplication: String
    authorName: String
    createdAt: DateTime
    previewUrl: URL
    objectCount: Int!
    truncated: Boolean!
    categories: [CategoryTotal!]!
    syncedAt: DateTime!
}

type CategoryTotal {
    id: OID!
    speckleType: String!
    objectCount: Int!
    unit: String
    volume: Float
    area: Float
    length: Float
}

type ChangeEntry {
    id: OID!
    speckleModelId: String!
    fromVersionId: String
    toVersionId: String!
    detectedAt: DateTime!
    addedCount: Int!
    removedCount: Int!
    modifiedCount: Int!
    touchedElements: [TouchedElement!]!
    deltas: [CategoryDelta!]!
}

"""
One element a revision touched, carrying the identity that survives edits.

A Speckle object id is a content hash, so it changes whenever the element does.
`identity` is the authoring tool's own element id where it has one, which is what
makes it possible to say that the same wall was modified in four revisions.
"""
type TouchedElement {
    id: OID!
    identity: String!
    objectId: String!
    speckleType: String!
    kind: ChangeKind!
}

enum ChangeKind {
    ADDED
    MODIFIED
    REMOVED
}

type CategoryDelta {
    id: OID!
    speckleType: String!
    unit: String
    countBefore: Int!
    countAfter: Int!
    volumeBefore: Float
    volumeAfter: Float
    areaBefore: Float
    areaAfter: Float
}

# identity

input SetProjectIdentityInput {
    serverUrl: URL!
    projectId: String!
    name: String
    description: String
    visibility: String
    syncedAt: DateTime!
}

input ClearSyncedDataInput {
    _: Boolean
}

# models

input UpsertModelInput {
    id: OID!
    speckleModelId: String!
    name: String!
    displayName: String
    updatedAt: DateTime
    latestVersionId: String
    versionCount: Int!
}

input RemoveModelInput {
    speckleModelId: String!
}

# revisions

input UpsertRevisionInput {
    id: OID!
    speckleModelId: String!
    modelName: String
    versionId: String!
    referencedObject: String!
    message: String
    sourceApplication: String
    authorName: String
    createdAt: DateTime
    previewUrl: URL
    objectCount: Int!
    truncated: Boolean
    syncedAt: DateTime!
    categories: [CategoryTotalInput!]!
}

input CategoryTotalInput {
    id: OID!
    speckleType: String!
    objectCount: Int!
    unit: String
    volume: Float
    area: Float
    length: Float
}

input RemoveRevisionInput {
    versionId: String!
}

# changes

input RecordChangeInput {
    id: OID!
    speckleModelId: String!
    fromVersionId: String
    toVersionId: String!
    detectedAt: DateTime!
    touchedElements: [TouchedElementInput!]
    deltas: [CategoryDeltaInput!]
}

input TouchedElementInput {
    id: OID!
    identity: String!
    objectId: String!
    speckleType: String!
    kind: ChangeKind!
}

input CategoryDeltaInput {
    id: OID!
    speckleType: String!
    unit: String
    countBefore: Int!
    countAfter: Int!
    volumeBefore: Float
    volumeAfter: Float
    areaBefore: Float
    areaAfter: Float
}